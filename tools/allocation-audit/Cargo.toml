[package]
name = "dustnet-allocation-audit"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
# The threat model is data. This tool is excluded from the workspace, so its
# lock is its own; the version is pinned to the one the workspace already
# vets rather than floating independently.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
