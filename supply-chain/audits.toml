[[audits.triomphe]]
who = "Dustnet maintainers"
criteria = "safe-to-deploy"
version = "0.1.16"
notes = "Reviewed triomphe 0.1.16 full source and unsafe code for safe-to-deploy, with Dustnet using only std-feature Arc::try_new, clone/drop/deref, and ptr_eq. Fallible allocation layout/null handling and Arc refcount ordering are sound. No ambient capabilities or build script. Known non-security caveats: pointer-shortcut PartialEq for non-reflexive T and documented leak-on-panicking or misreporting header iterators; neither is used by Dustnet."

