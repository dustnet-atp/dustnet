# Publishes the container images to GHCR: the client, and the server base the
# sites are built on.
#
# One workflow over a matrix rather than one per image. The version check, the
# per-architecture native builds, the digest-and-merge dance and — most of all —
# the full-length action SHAs all have to be identical for both, and two files
# holding the same pins is two places for them to drift apart.
#
# This is the only hosted job in the repository, and that is deliberate. The
# verification gate runs locally on macOS — `make ci` — because macOS runners
# bill at a 10x multiplier and every hosted run of the gate sat queued while
# this repository was private on a free plan. Nothing here changes that
# argument: this workflow is Linux, runs on a tag rather than a push, and
# builds an artefact that cannot be produced locally in one step, because no
# single machine is both amd64 and arm64.
#
# GHCR needs no secret. The built-in GITHUB_TOKEN can write packages owned by
# this repository, so there is no PAT to provision, store, or rotate.
# Every action is pinned to a full-length commit SHA rather than a tag. A tag is
# mutable: whoever controls the action repository can move v7 to any commit, and
# these actions hold a registry token while they run. The organisation requires
# the pins, and this repository already treats its Rust dependencies the same
# way — cargo-vet, cargo-deny, supply-chain/imports.lock. The trailing comment
# is the release each SHA belongs to; update both together or neither.
name: publish-image

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Cargo.toml is the single source of the version; the tag is checked against
  # it rather than trusted. A tag that disagrees with the workspace version
  # would publish an image whose name matches no release, which is the same
  # class of drift that left the README advertising 0.2.0-alpha.4 after the
  # bump to 0.2.0.
  #
  # It is its own job, ahead of the builds, so a mismatch costs seconds rather
  # than two full Rust compiles: `needs: version` means neither architecture
  # starts until the tag and the workspace agree.
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      latest: ${{ steps.resolve.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: resolve
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test -n "$version" || { echo "no version in Cargo.toml"; exit 1; }
          if [ "${{ github.ref_type }}" = tag ] \
             && [ "${{ github.ref_name }}" != "v$version" ]; then
            echo "tag ${{ github.ref_name }} does not match Cargo.toml v$version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A hyphen means a pre-release. Cargo already skips those for a bare
          # requirement; `latest` has no such rule, so moving it to a
          # pre-release would hand every README reader an alpha unasked.
          case "$version" in
            *-*) echo "latest=false" >> "$GITHUB_OUTPUT" ;;
            *)   echo "latest=true"  >> "$GITHUB_OUTPUT" ;;
          esac
          echo "publishing $version"

  # One runner per architecture, each building natively. The alternative is
  # buildx with QEMU on a single amd64 runner, which emulates the whole arm64
  # rustc run and takes several times longer for an identical result.
  #
  # Each job pushes an untagged manifest addressed only by digest; the merge
  # job below is what attaches the human-readable tags. Tagging here instead
  # would mean two jobs racing to own the same tag, and the loser's
  # architecture silently vanishing from it.
  build:
    needs: version
    strategy:
      fail-fast: false
      # A cross product, not a list: each image is built once per architecture,
      # and adding a third image later means one more entry rather than another
      # copy of the whole job.
      matrix:
        image:
          - name: dustnet
            repo: ghcr.io/dustnet-atp/dustnet
            file: Dockerfile
          - name: dustnetd
            repo: ghcr.io/dustnet-atp/dustnetd
            file: Dockerfile.dustnetd
        target:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.image.file }}
          platforms: ${{ matrix.target.platform }}
          provenance: false
          # Scoped per image *and* architecture. Per architecture alone was
          # already needed so the two runners do not evict each other; adding a
          # second image to the same scope would have them doing it again along
          # the other axis.
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.target.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.target.arch }}
          outputs: type=image,name=${{ matrix.image.repo }},push-by-digest=true,name-canonical=true,push=true

      - name: Record digest
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # The image name is in here because the merge job globs these: without
          # it, one image's digests would be merged into the other's manifest.
          name: digest-${{ matrix.image.name }}-${{ matrix.target.arch }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  # Assembles each image's two digests into one multi-arch manifest list and puts
  # the tags on it, so `docker run ghcr.io/dustnet-atp/dustnet` resolves to the
  # right architecture without the caller naming one. One job per image, because
  # a manifest list belongs to exactly one repository.
  merge:
    needs: [version, build]
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: dustnet
            repo: ghcr.io/dustnet-atp/dustnet
          - name: dustnetd
            repo: ghcr.io/dustnet-atp/dustnetd
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          # Only this image's digests. A bare `digest-*` would pull both images
          # in and hand each manifest list the other's architectures.
          pattern: digest-${{ matrix.image.name }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest list
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ matrix.image.repo }}
          VERSION: ${{ needs.version.outputs.version }}
          LATEST: ${{ needs.version.outputs.latest }}
        run: |
          set -euo pipefail
          tags="--tag ${IMAGE}:${VERSION}"
          if [ "$LATEST" = true ]; then
            tags="$tags --tag ${IMAGE}:latest"
          fi
          # shellcheck disable=SC2086
          docker buildx imagetools create $tags \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Verify both architectures are present
        env:
          IMAGE: ${{ matrix.image.repo }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"
          for arch in amd64 arm64; do
            docker buildx imagetools inspect --raw "${IMAGE}:${VERSION}" \
              | grep -q "\"architecture\": *\"$arch\"" \
              || { echo "manifest list is missing linux/$arch"; exit 1; }
          done
