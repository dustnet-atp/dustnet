[package]
name = "dustnetd"
version = "0.2.0-alpha.3"
edition = "2024"
license = "MIT"
description = "Static ATP server daemon: the runnable form of dustnet-server"
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/dustnetd"
keywords = ["atp", "aml", "server", "daemon", "static"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "dustnetd"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6.9"
clap_mangen = "0.3.3"
dustnet-core = { path = "../dustnet-core", version = "=0.2.0-alpha.3" }
dustnet-server = { path = "../dustnet-server", version = "=0.2.0-alpha.3" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
